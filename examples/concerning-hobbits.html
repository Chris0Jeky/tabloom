<body style="margin:0">
<div id="app"></div>

import { createScore, createPlayer } from '../src/index.js';

 */

  title: 'Concerning Hobbits',
  artist: 'Howard Shore',
  tuning: 'dadgad',
  meta: {
    note: 'Tuning assumed DADGAD. Shots overlap in the source video; duplicates are kept.',

  sections: [
    {
      title: 'Shot 1 — 234317',
      bars: [2, 6],
      events: [
        [[2, 3]], [[1, 0]], [[1, 2], [4, 0]], [[1, 5]], [[1, 2]],
        [[1, 0]], [[2, 3], [4, 0]], [[1, 2]], [[1, 5]],

        [[1, 7], [2, 0], [3, 0]], [[1, 10]], [[1, 9]], [[1, 5]],
        [[1, 2]], [[1, 3]], [[1, 2]], [[1, 0], [5, 0]], [[2, 3], [1, 0]],
        [[1, 2]], [[1, 5]], [[1, 2]], [[1, 0]], [[2, 3]], [[1, 0]],
      ],
    },
    {
      title: 'Shot 3 — 234920',
      bars: [3, 6],

        [[2, 3], [4, 0]], [[1, 2]], [[1, 5]],
        [[1, 7], [2, 0], [3, 0]], [[1, 5]], [[1, 2]],

createPlayer(document.getElementById('app'), { score, bpm: 60 });
</script>
