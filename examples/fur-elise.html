<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Für Elise — tabloom demo</title>
</head>
<body style="margin:0">
<div id="app"></div>
<script type="module">
import { parseAsciiTab, createPlayer } from '../src/index.js';

const TAB = `# Section 1
e|--0-----0-----0-----0--3--1--------|--------0--1--------|
B|-----4-----4-----------0-----2-----|--0--3--------1-----|
G|-------------------------------2---|-----------------0--|
D|-----------------------------------|-----------0--------|
A|-----------------------0-----3---0-|-----2-----------3--|
E|-----------------------------------|--------------------|

# Section 2
e|--------0--4--0-----0-----0-----0--|--3--1--------2---2-|
B|--4--0-----------4-----4-----4-----|--------2---2---0---|
G|--4--------------------------------|----------2---------|
D|--0--------------------------------|--------------------|
A|-----------------------------------|--------0-----2-----|
E|-----------------------------------|--------------------|

# Section 3
e|--1--0--------0--1--3--0--1--0-----|-----0--3--1-----3--|
B|--------2--0-----0--------------3--|--1-----------2-----|
G|-----2-----------0-----------------|--0-----0-----------|
D|-----------------------0-----------|--------------2-----|
A|-----------2-----------------------|-----3--------------|
E|--0--------------------------------|--------------------|

# Ending
e|--1-----0-----------0--|
B|-----3-----------1--1--|
G|-----------2--0--2--2--|
D|--0-----------0-----2--|
A|--------------------0--|
E|--------0--------------|`;

const score = parseAsciiTab(TAB, {
  title: 'Für Elise',
  artist: 'Ludwig van Beethoven',
  tuning: 'standard',
});

createPlayer(document.getElementById('app'), {
  score,
  bpm: 60,
  showNoteNames: true,
});
</script>
</body>
</html>
