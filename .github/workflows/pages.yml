name: Deploy demos

# The demos are plain ES modules, so GitHub Pages can serve the repository root
# as-is: no build, no bundler, no artifacts to keep in sync.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the static site
        shell: bash
        run: |
          mkdir -p _site
          cp -r src examples _site/
          cp -r docs _site/ 2>/dev/null || true
          cp README.md LICENSE _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
